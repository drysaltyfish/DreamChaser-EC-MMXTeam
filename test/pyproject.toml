[project]
name = "fusai-test-gui"
version = "0.1.0"
description = "Windows Tkinter bench GUI for the Fusai v1.3 serial protocol"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fusai-sdk",
    "pyserial>=3.5",
]

[tool.uv]
package = false

[tool.uv.sources]
fusai-sdk = { path = "../sdk", editable = true }
